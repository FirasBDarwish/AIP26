<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Encounter Viewer</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, sans-serif;
        background: #f4f6f9;
        color: #253047;
        margin: 0;
        padding: 30px;
    }

    .container {
        max-width: 1100px;
        margin: auto;
    }

    h1 {
        margin-bottom: 8px;
    }

    .subtitle {
        color: #718096;
        margin-bottom: 25px;
    }

    .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    input {
        padding: 12px;
        border: 1px solid #d6dce5;
        border-radius: 8px;
        font-size: 14px;
        flex: 1;
        min-width: 200px;
    }

    button {
        padding: 11px 18px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        font-size: 14px;
    }

    button:hover {
        background: #1d4ed8;
    }

    button:disabled {
        background: #cbd5e1;
        cursor: not-allowed;
    }

    .counter {
        font-size: 14px;
        color: #64748b;
    }

    .card {
        background: white;
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .card h2 {
        font-size: 18px;
        margin-top: 0;
        padding-bottom: 12px;
        border-bottom: 1px solid #e2e8f0;
        color: #1e40af;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .field-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #94a3b8;
        margin-bottom: 5px;
    }

    .field-value {
        font-size: 15px;
        font-weight: 500;
        overflow-wrap: anywhere;
    }

    .note {
        background: #f8fafc;
        border-left: 4px solid #2563eb;
        padding: 22px;
        border-radius: 6px;
        font-size: 15px;
        line-height: 1.85;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .patient-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    .patient-name {
        font-size: 25px;
        font-weight: 650;
    }

    .patient-id {
        color: #64748b;
        font-size: 14px;
    }

    @media (max-width: 750px) {
        .grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 480px) {
        .grid {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>Patient Encounter Viewer</h1>
    <div class="subtitle">
        Browse patient records and discharge summaries
    </div>

    <div class="toolbar">
        <input
            id="search"
            type="text"
            placeholder="Search patients, diagnoses, discharge notes..."
            oninput="filterRecords()"
        >

        <button onclick="previousRecord()">← Previous</button>
        <button onclick="nextRecord()">Next →</button>

        <span class="counter" id="counter"></span>
    </div>

    <div id="record"></div>

</div>

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatLabel(key) {
    return key
        .replaceAll("_", " ")
        .replace(/\b\w/g, c => c.toUpperCase());
}

function makeField(key, value) {
    const displayValue =
        value === undefined || value === null || value === ""
        ? "—"
        : value;

    return `
        <div>
            <div class="field-label">${formatLabel(key)}</div>
            <div class="field-value">${escapeHTML(displayValue)}</div>
        </div>
    `;
}

function makeSection(title, keys, record) {
    const fields = keys
        .map(key => makeField(key, record[key]))
        .join("");

    return `
        <div class="card">
            <h2>${title}</h2>
            <div class="grid">
                ${fields}
            </div>
        </div>
    `;
}

function render() {
    const container = document.getElementById("record");
    const counter = document.getElementById("counter");

    if (filteredRecords.length === 0) {
        container.innerHTML =
            '<div class="card">No matching records found.</div>';

        counter.textContent = "0 records";
        return;
    }

    const record = filteredRecords[currentIndex];

    counter.textContent =
        `${currentIndex + 1} / ${filteredRecords.length}`;

    let html = `
        <div class="card">
            <div class="patient-header">
                <div>
                    <div class="patient-name">
                        ${escapeHTML(record.patient_name || "Unnamed Patient")}
                    </div>

                    <div class="patient-id">
                        Patient ID: ${escapeHTML(record.patient_id)}
                        &nbsp; | &nbsp;
                        Encounter: ${escapeHTML(record.encounter_id)}
                    </div>
                </div>
            </div>
        </div>
    `;

    for (const [title, keys] of Object.entries(sections)) {
        html += makeSection(title, keys, record);
    }

    html += `
        <div class="card">
            <h2>Discharge Note</h2>

            <div class="note">${escapeHTML(
                record.discharge_note || "No discharge note available."
            )}</div>
        </div>
    `;

    container.innerHTML = html;
}

function nextRecord() {
    if (currentIndex < filteredRecords.length - 1) {
        currentIndex++;
        render();
        window.scrollTo(0, 0);
    }
}

function previousRecord() {
    if (currentIndex > 0) {
        currentIndex--;
        render();
        window.scrollTo(0, 0);
    }
}

function filterRecords() {
    const query =
        document.getElementById("search").value.toLowerCase();

    filteredRecords = allRecords.filter(record =>
        Object.values(record).some(value =>
            String(value ?? "").toLowerCase().includes(query)
        )
    );

    currentIndex = 0;
    render();
}

// Keyboard navigation
document.addEventListener("keydown", e => {
    if (document.activeElement.tagName === "INPUT") return;

    if (e.key === "ArrowRight") nextRecord();
    if (e.key === "ArrowLeft") previousRecord();
});

render();
